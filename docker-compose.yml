version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: heartbeat-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: heartbeat
      MYSQL_CHARSET: utf8mb4
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hb-net

  redis:
    image: redis:7-alpine
    container_name: heartbeat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - hb-net

  app:
    build: ./backend
    container_name: heartbeat-app
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_USER: root
      DB_PASSWORD: root
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/heartbeat?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - hb-net

volumes:
  mysql-data:
  redis-data:

networks:
  hb-net:
    driver: bridge
