spring:
  datasource:
    url: jdbc:h2:mem:heartbeat;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  h2:
    console:
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379

heartbeat:
  redis:
    enabled: false   # 本地无 Redis，关闭缓存，排行榜走 MySQL/H2 聚合
